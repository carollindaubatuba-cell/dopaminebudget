<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dopamine Budget</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌈</text></svg>">
<style>
:root{
  --bg:#FDF6EC; --bg2:#FFFDF9; --surface:#FFFFFF; --ink:#3E3547; --ink2:#6B6076; --muted:#9C93A8;
  --line:#F0E8DC; --shadow:0 10px 30px rgba(120,100,140,.10); --shadow-sm:0 4px 14px rgba(120,100,140,.08);
  --coral:#FF9E8D; --teal:#7ED8D0; --yellow:#FFD98A; --lavender:#C4B5F7; --mint:#A9E7C6; --sky:#9BD6F7; --peach:#FFC5A6;
  --c1:var(--coral); --c2:var(--teal); --c3:var(--yellow); --c4:var(--lavender); --c5:var(--mint); --c6:var(--sky);
  --r:24px; --r-sm:16px; --r-xs:12px;
  --font-d:'Baloo 2','Avenir Next Rounded','Trebuchet MS',system-ui,sans-serif;
  --font-b:'Nunito','Avenir Next','Segoe UI',system-ui,sans-serif;
}
/* ---------- THEMES ---------- */
[data-theme="ocean"]{--bg:#EEF7FB;--bg2:#F8FCFE;--line:#DFEEF5;--coral:#7FC8E8;--teal:#6FD6C9;--yellow:#A9E0F5;--lavender:#9FB8EE;--mint:#A5E7DC;--sky:#8FCFF0;--peach:#BFE4F2;--ink:#2D4152;--ink2:#5A7186;}
[data-theme="sunset"]{--bg:#FFF3EC;--bg2:#FFFAF6;--line:#F8E3D6;--coral:#FF9C8B;--teal:#FFB59A;--yellow:#FFCF8C;--lavender:#F4A6BE;--mint:#FFC9A0;--sky:#FFB1A6;--peach:#FFD3B0;--ink:#4A3038;--ink2:#7C5A5E;}
[data-theme="forest"]{--bg:#F1F7EF;--bg2:#FAFDF8;--line:#E0EDDC;--coral:#A8CE9A;--teal:#7FCBA8;--yellow:#DCE79B;--lavender:#AFCFB8;--mint:#9EE0B4;--sky:#BFE0C6;--peach:#D6E7A8;--ink:#2F3F31;--ink2:#5E7060;}
[data-theme="candy"]{--bg:#FFF1F6;--bg2:#FFFAFC;--line:#FBDDE8;--coral:#FF9CC0;--teal:#9BE0E6;--yellow:#FFD6E0;--lavender:#D3B4F5;--mint:#B6EBD6;--sky:#AFD3FA;--peach:#FFC0CB;--ink:#4A2E3C;--ink2:#7E5C6C;}
[data-theme="lavender"]{--bg:#F5F1FD;--bg2:#FBF9FF;--line:#E7DFF7;--coral:#C1AEF3;--teal:#B8C7F5;--yellow:#E0D4FB;--lavender:#B49BF0;--mint:#CFC0F7;--sky:#A9BDF2;--peach:#DCC7F5;--ink:#372C4C;--ink2:#655A7C;}
[data-theme="galaxy"]{--bg:#EFF0FA;--bg2:#F9F9FE;--line:#E1E2F2;--coral:#A79BF0;--teal:#7FC4E8;--yellow:#F2C6E8;--lavender:#9B8BEB;--mint:#9FD8E8;--sky:#8FA8EE;--peach:#D3B0F0;--ink:#2C2B45;--ink2:#5A5878;}
[data-theme="matcha"]{--bg:#F4F7EB;--bg2:#FBFDF5;--line:#E6EDD5;--coral:#C3D69B;--teal:#96CFB0;--yellow:#E4E9A6;--lavender:#B9CFA8;--mint:#A8DDBB;--sky:#C6E0C0;--peach:#DCE5A0;--ink:#374030;--ink2:#65705C;}
[data-dark="1"]{
  --bg:#221E2B; --bg2:#2A2535; --surface:#2E2839; --ink:#F3EEF8; --ink2:#C6BCD3; --muted:#9A8FA8;
  --line:#3B3448; --shadow:0 12px 34px rgba(0,0,0,.35); --shadow-sm:0 4px 16px rgba(0,0,0,.28);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink); font-family:var(--font-b);
  font-size:15px; line-height:1.5; min-height:100vh;
  transition:background .45s ease,color .45s ease;
  padding-bottom:env(safe-area-inset-bottom);
}
h1,h2,h3,h4,.dspl{font-family:var(--font-d);font-weight:700;letter-spacing:.2px;margin:0}
button{font-family:inherit;font-size:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:15px;color:var(--ink)}
::selection{background:var(--lavender);color:#fff}
:focus-visible{outline:3px solid var(--lavender);outline-offset:3px;border-radius:12px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* ---------- SHELL ---------- */
.app{display:flex;min-height:100vh}
.side{
  width:238px;flex:0 0 238px;padding:22px 14px 30px;position:sticky;top:0;height:100vh;
  overflow-y:auto;scrollbar-width:none;
}
.side::-webkit-scrollbar{display:none}
.brand{display:flex;align-items:center;gap:10px;padding:6px 10px 18px}
.brand .logo{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;font-size:22px;
  background:linear-gradient(135deg,var(--coral),var(--lavender));box-shadow:var(--shadow-sm)}
.brand b{font-family:var(--font-d);font-size:19px;line-height:1.05;display:block}
.brand span{font-size:11px;color:var(--muted);letter-spacing:.6px;text-transform:uppercase;font-weight:700}
.nav{display:flex;flex-direction:column;gap:3px}
.nav button{
  display:flex;align-items:center;gap:11px;padding:11px 13px;border-radius:15px;font-weight:700;
  color:var(--ink2);transition:transform .18s cubic-bezier(.34,1.56,.64,1),background .2s,color .2s;text-align:left;width:100%;
}
.nav button .ic{font-size:17px;width:24px;text-align:center}
.nav button:hover{background:var(--bg2);transform:translateX(3px)}
.nav button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow-sm)}
.nav button.on .ic{transform:scale(1.15)}
.coinbar{margin-top:18px;background:var(--surface);border-radius:var(--r-sm);padding:12px 14px;box-shadow:var(--shadow-sm);display:flex;flex-direction:column;gap:8px}
.coinbar .row{display:flex;align-items:center;justify-content:space-between;font-weight:800;font-size:13px}
.coinbar small{color:var(--muted);font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.5px}
.xpbar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.xpbar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--teal),var(--sky));transition:width .8s cubic-bezier(.2,.8,.3,1)}

.main{flex:1;min-width:0;padding:26px 30px 70px;max-width:1180px}
.topbar{display:none}
.mobnav{display:none}

/* ---------- CARDS ---------- */
.card{background:var(--surface);border-radius:var(--r);padding:22px;box-shadow:var(--shadow);transition:transform .3s cubic-bezier(.34,1.4,.64,1),box-shadow .3s}
.card.hov:hover{transform:translateY(-4px);box-shadow:0 18px 42px rgba(120,100,140,.16)}
.grid{display:grid;gap:18px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 14px}
.sec-h h2{font-size:22px}
.eyebrow{font-size:11px;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted);font-weight:800}
.muted{color:var(--muted)}
.tiny{font-size:12px}

/* ---------- BUTTONS ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:11px 18px;border-radius:99px;
  font-weight:800;font-size:14px;background:var(--surface);box-shadow:var(--shadow-sm);
  transition:transform .2s cubic-bezier(.34,1.56,.64,1),box-shadow .2s,filter .2s;
}
.btn:hover{transform:translateY(-2px) scale(1.03);box-shadow:0 10px 24px rgba(120,100,140,.18)}
.btn:active{transform:scale(.95)}
.btn.pri{background:linear-gradient(135deg,var(--coral),var(--peach));color:#4A3038}
[data-dark="1"] .btn.pri{color:#241E2C}
.btn.gho{background:transparent;box-shadow:inset 0 0 0 2px var(--line)}
.btn.sm{padding:8px 13px;font-size:13px}
.btn.blk{width:100%}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:99px;background:var(--bg);font-size:12px;font-weight:800}

/* ---------- DASHBOARD ---------- */
.hello h1{font-size:clamp(27px,4.6vw,40px);line-height:1.12}
.hello h1 em{font-style:normal;background:linear-gradient(100deg,var(--coral),var(--lavender),var(--sky));-webkit-background-clip:text;background-clip:text;color:transparent}
.hello p{margin:7px 0 0;color:var(--ink2);font-weight:600}
.dash-top{display:grid;grid-template-columns:1.25fr .95fr;gap:18px;align-items:start}
.moods{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.mood{flex:1;min-width:72px;padding:13px 6px;border-radius:18px;background:var(--bg);text-align:center;font-weight:800;font-size:12px;
  transition:transform .22s cubic-bezier(.34,1.56,.64,1),box-shadow .22s,background .22s}
.mood b{display:block;font-size:26px;font-weight:400;margin-bottom:3px;transition:transform .25s}
.mood:hover{transform:translateY(-4px)}
.mood:hover b{transform:scale(1.2) rotate(-6deg)}
.mood.on{background:var(--surface);box-shadow:0 0 0 3px var(--lavender) inset,var(--shadow-sm)}
.moodhist{display:flex;gap:5px;margin-top:14px;flex-wrap:wrap}
.moodhist div{width:26px;height:26px;border-radius:9px;background:var(--bg);display:grid;place-items:center;font-size:13px}

.ringwrap{display:flex;flex-direction:column;align-items:center;gap:6px}
.ringbox{position:relative;width:100%;max-width:300px;aspect-ratio:1}
.ringbox svg{width:100%;height:100%;transform:rotate(-90deg)}
.ringbox circle{fill:none;stroke-linecap:round;transition:stroke-dashoffset 1.2s cubic-bezier(.2,.8,.3,1)}
.ringmid{position:absolute;inset:0;display:grid;place-content:center;text-align:center;gap:2px}
.ringmid small{font-size:11px;letter-spacing:1.1px;text-transform:uppercase;color:var(--muted);font-weight:800}
.ringmid b{font-family:var(--font-d);font-size:clamp(26px,5vw,38px);line-height:1}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px;width:100%;margin-top:6px}
.legend div{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700}
.legend i{width:11px;height:11px;border-radius:4px;flex:0 0 11px}
.legend span{margin-left:auto;color:var(--ink2);font-weight:800}

.mission{background:linear-gradient(135deg,var(--yellow),var(--peach));color:#4A3038;position:relative;overflow:hidden}
[data-dark="1"] .mission{color:#241E2C}
.mission:after{content:"";position:absolute;right:-40px;top:-40px;width:150px;height:150px;border-radius:50%;background:rgba(255,255,255,.28)}
.mission h3{font-size:21px;position:relative}
.mission .btn{position:relative}

.pet{display:flex;align-items:center;gap:16px}
.petart{width:112px;height:112px;flex:0 0 112px;border-radius:28px;background:var(--bg);display:grid;place-items:center;position:relative;overflow:hidden}
.petart .blob{font-size:54px;animation:bob 3.4s ease-in-out infinite;transition:filter .4s}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-8px) rotate(2deg)}}
.petart.sleepy .blob{animation:snooze 4s ease-in-out infinite;filter:grayscale(.45) opacity(.75)}
@keyframes snooze{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(2px) scale(.97)}}
.zzz{position:absolute;top:12px;right:14px;font-size:15px;opacity:.65;animation:bob 2.6s ease-in-out infinite}
.acc{position:absolute;top:14px;font-size:26px}

.wheelwrap{display:flex;flex-direction:column;align-items:center;gap:12px}
.wheel{position:relative;width:190px;height:190px}
.wheel svg{width:100%;height:100%;transition:transform 4.2s cubic-bezier(.15,.9,.2,1)}
.wheel .pin{position:absolute;top:-8px;left:50%;transform:translateX(-50%);font-size:24px;z-index:2;filter:drop-shadow(0 3px 4px rgba(0,0,0,.15))}
.wheel .hub{position:absolute;inset:0;margin:auto;width:44px;height:44px;border-radius:50%;background:var(--surface);box-shadow:var(--shadow-sm);display:grid;place-items:center;font-size:20px}

/* ---------- EXPENSE PAD ---------- */
.catgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:12px}
.cat{padding:18px 8px;border-radius:20px;text-align:center;font-weight:800;font-size:13px;color:#4A3038;
  transition:transform .2s cubic-bezier(.34,1.56,.64,1),box-shadow .2s,filter .2s;box-shadow:var(--shadow-sm)}
[data-dark="1"] .cat{color:#241E2C}
.cat b{display:block;font-size:30px;font-weight:400;margin-bottom:5px;transition:transform .25s cubic-bezier(.34,1.56,.64,1)}
.cat:hover{transform:translateY(-5px) scale(1.04);box-shadow:0 14px 28px rgba(120,100,140,.18)}
.cat:hover b{transform:scale(1.18) rotate(-7deg)}
.cat:active{transform:scale(.94)}

.list{display:flex;flex-direction:column;gap:9px}
.row{display:flex;align-items:center;gap:12px;padding:13px 15px;border-radius:var(--r-sm);background:var(--bg);transition:transform .2s,background .2s}
.row:hover{transform:translateX(4px)}
.em{width:38px;height:38px;flex:0 0 38px;border-radius:13px;display:grid;place-items:center;font-size:19px;background:var(--surface)}
.gr{flex:1;min-width:0}
.gr b{display:block;font-size:14px;font-weight:800}
.gr small{color:var(--muted);font-size:12px;font-weight:600}
.bill.paid .gr small{color:inherit;opacity:.72}
.amt{font-weight:800;font-family:var(--font-d);font-size:16px;white-space:nowrap}
.x{opacity:.35;font-size:16px;padding:4px 6px;border-radius:8px;transition:.2s;line-height:1}
.x:hover{opacity:1;background:var(--surface);transform:scale(1.15)}
.empty{text-align:center;padding:34px 18px;color:var(--muted);font-weight:700}
.empty b{display:block;font-size:34px;margin-bottom:8px;font-weight:400}

/* ---------- BUBBLES ---------- */
.bubbles{position:relative;height:330px;width:100%}
.bub{position:absolute;border-radius:50%;display:grid;place-content:center;text-align:center;color:#4A3038;font-weight:800;
  animation:float 6s ease-in-out infinite;transition:transform .3s cubic-bezier(.34,1.56,.64,1),filter .3s;cursor:default}
[data-dark="1"] .bub{color:#241E2C}
.bub:hover{transform:scale(1.09);filter:brightness(1.04);z-index:5}
.bub b{font-size:26px;font-weight:400;display:block}
.bub span{font-size:11px;display:block;opacity:.85}
.bub em{font-style:normal;font-size:13px;font-family:var(--font-d)}
@keyframes float{0%,100%{translate:0 0}50%{translate:0 -11px}}

/* ---------- BILLS / PLANTS / DEBT ---------- */
.bill{display:flex;align-items:center;gap:14px;padding:16px;border-radius:var(--r-sm);background:var(--bg);transition:.3s}
.bill.paid{background:linear-gradient(135deg,var(--mint),var(--teal));color:#2F4A3D}
[data-dark="1"] .bill.paid{color:#1E2C25}
.bill.paid .ck{animation:pop .5s cubic-bezier(.34,1.7,.64,1)}
@keyframes pop{0%{transform:scale(0) rotate(-40deg)}70%{transform:scale(1.35) rotate(9deg)}100%{transform:scale(1)}}
.toggle{width:50px;height:29px;border-radius:99px;background:var(--line);position:relative;transition:background .28s;flex:0 0 50px}
.toggle i{position:absolute;top:3px;left:3px;width:23px;height:23px;border-radius:50%;background:var(--surface);box-shadow:0 2px 6px rgba(0,0,0,.15);transition:transform .28s cubic-bezier(.34,1.56,.64,1)}
.toggle.on{background:var(--teal)}
.toggle.on i{transform:translateX(21px)}

.plantcard{text-align:center}
.pot{height:170px;display:flex;align-items:flex-end;justify-content:center;margin-bottom:6px}
.pot svg{overflow:visible}
.grow{transform-origin:bottom center;animation:grow .9s cubic-bezier(.34,1.5,.64,1)}
@keyframes grow{from{transform:scaleY(.3) scaleX(.7);opacity:0}to{transform:scale(1);opacity:1}}
.sway{transform-origin:bottom center;animation:sway 4.5s ease-in-out infinite}
@keyframes sway{0%,100%{transform:rotate(-2.5deg)}50%{transform:rotate(2.5deg)}}
.bar{height:12px;border-radius:99px;background:var(--line);overflow:hidden;margin:10px 0 6px}
.bar i{display:block;height:100%;border-radius:99px;transition:width 1s cubic-bezier(.2,.8,.3,1);background:linear-gradient(90deg,var(--mint),var(--teal))}

/* ---------- WISHLIST ---------- */
.masonry{columns:3;column-gap:16px}
.wish{break-inside:avoid;margin-bottom:16px;border-radius:var(--r);overflow:hidden;background:var(--surface);box-shadow:var(--shadow);transition:transform .3s cubic-bezier(.34,1.4,.64,1),box-shadow .3s}
.wish:hover{transform:translateY(-5px) rotate(-.5deg);box-shadow:0 20px 40px rgba(120,100,140,.18)}
.wish .ph{height:130px;display:grid;place-items:center;font-size:52px;background-size:cover;background-position:center}
.wish .bd{padding:15px}

/* ---------- CALENDAR ---------- */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal .dw{text-align:center;font-size:11px;font-weight:800;color:var(--muted);padding:4px 0}
.cal .d{aspect-ratio:1;border-radius:14px;background:var(--bg);padding:6px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:3px;transition:transform .2s,box-shadow .2s;font-size:12px;font-weight:800}
.cal .d:hover{transform:scale(1.07);box-shadow:var(--shadow-sm);z-index:2}
.cal .d.today{box-shadow:0 0 0 2.5px var(--coral) inset}
.cal .d.out{opacity:.32}
.dots{display:flex;gap:3px;flex-wrap:wrap;justify-content:center}
.dots i{width:6px;height:6px;border-radius:50%}

/* ---------- CHALLENGES / BADGES / HABITS ---------- */
.hab{display:grid;grid-template-columns:150px repeat(7,1fr);gap:7px;align-items:center;min-width:520px}
.hab .hn{font-weight:800;font-size:13px;display:flex;align-items:center;gap:7px}
.hab .cellb{aspect-ratio:1;border-radius:12px;background:var(--bg);display:grid;place-items:center;font-size:14px;transition:transform .2s cubic-bezier(.34,1.6,.64,1),background .2s}
.hab .cellb:hover{transform:scale(1.14)}
.hab .cellb.on{background:linear-gradient(135deg,var(--mint),var(--teal));animation:pop .4s cubic-bezier(.34,1.7,.64,1)}
.scroll-x{overflow-x:auto;padding-bottom:6px;scrollbar-width:thin}

.badge{text-align:center;padding:18px 10px;border-radius:20px;background:var(--bg);transition:transform .25s cubic-bezier(.34,1.5,.64,1)}
.badge:hover{transform:translateY(-4px) scale(1.03)}
.badge.got{background:linear-gradient(135deg,var(--yellow),var(--peach));color:#4A3038}
[data-dark="1"] .badge.got{color:#241E2C}
.badge b{display:block;font-size:34px;font-weight:400;margin-bottom:6px}
.badge.got b{animation:bob 3s ease-in-out infinite}
.badge.locked b{filter:grayscale(1) opacity(.4)}

.themecard{padding:16px;border-radius:20px;text-align:center;font-weight:800;transition:transform .25s cubic-bezier(.34,1.5,.64,1),box-shadow .25s;position:relative}
.themecard:hover{transform:translateY(-4px)}
.themecard .sw{display:flex;gap:5px;justify-content:center;margin-bottom:10px}
.themecard .sw i{width:17px;height:17px;border-radius:6px}
.themecard.on{box-shadow:0 0 0 3px var(--ink) inset}

/* ---------- CHARTS ---------- */
.chart{width:100%;height:210px;display:flex;align-items:flex-end;gap:8px}
.chart .cb{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:6px;height:100%}
.chart .cb i{width:100%;max-width:46px;border-radius:12px 12px 6px 6px;transition:height .9s cubic-bezier(.2,.8,.3,1);min-height:4px}
.chart .cb small{font-size:11px;color:var(--muted);font-weight:800}

/* ---------- MODAL ---------- */
.scrim{position:fixed;inset:0;background:rgba(50,40,60,.42);backdrop-filter:blur(5px);display:grid;place-items:center;padding:18px;z-index:60;animation:fade .25s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{background:var(--surface);border-radius:28px;padding:24px;width:100%;max-width:430px;box-shadow:0 30px 70px rgba(60,40,80,.3);animation:rise .35s cubic-bezier(.2,1.2,.3,1);max-height:88vh;overflow-y:auto}
@keyframes rise{from{transform:translateY(26px) scale(.96);opacity:0}to{transform:none;opacity:1}}
.modal h3{font-size:21px;margin-bottom:4px}
.field{margin-top:13px}
.field label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.9px;font-weight:800;color:var(--muted);margin-bottom:6px}
.field input,.field select,.field textarea{width:100%;padding:12px 14px;border-radius:15px;background:var(--bg);border:2px solid transparent;outline:none;transition:border-color .2s,background .2s;font-weight:700}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--lavender);background:var(--bg2)}
.bigamt{font-family:var(--font-d);font-size:40px!important;text-align:center;padding:14px!important}
.mrow{display:flex;gap:10px;margin-top:18px}
.mrow .btn{flex:1}
.pick{display:flex;gap:8px;flex-wrap:wrap}
.pick button{padding:9px 14px;border-radius:99px;background:var(--bg);font-weight:800;font-size:13px;transition:transform .2s cubic-bezier(.34,1.6,.64,1)}
.pick button:hover{transform:scale(1.06)}
.pick button.on{background:var(--lavender);color:#fff}

/* ---------- TOAST + CONFETTI ---------- */
#confetti{position:fixed;inset:0;pointer-events:none;z-index:200}
#toasts{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:150;display:flex;flex-direction:column;gap:9px;align-items:center;pointer-events:none;width:min(92vw,420px)}
.toast{background:var(--surface);border-radius:99px;padding:12px 20px;box-shadow:0 14px 34px rgba(80,60,100,.22);font-weight:800;font-size:14px;
  display:flex;align-items:center;gap:9px;animation:tin .4s cubic-bezier(.2,1.3,.3,1);max-width:100%}
@keyframes tin{from{transform:translateY(24px) scale(.9);opacity:0}to{transform:none;opacity:1}}
.toast.out{animation:tout .35s ease forwards}
@keyframes tout{to{transform:translateY(-10px);opacity:0}}

.banner{display:flex;align-items:center;gap:11px;padding:13px 17px;border-radius:var(--r-sm);font-weight:800;font-size:13px;background:linear-gradient(135deg,var(--sky),var(--lavender));color:#33304A;margin-bottom:10px}
[data-dark="1"] .banner{color:#221E2C}

/* ---------- RESPONSIVE ---------- */
@media(max-width:1080px){.g4{grid-template-columns:repeat(2,1fr)}.masonry{columns:2}}
@media(max-width:900px){
  .side{display:none}
  .app{flex-direction:column}
  .main{padding:14px 14px 118px;max-width:100%}
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 14px 4px;position:sticky;top:0;background:var(--bg);z-index:30}
  .topbar .logo{width:38px;height:38px;border-radius:13px;display:grid;place-items:center;font-size:19px;background:linear-gradient(135deg,var(--coral),var(--lavender))}
  .mobnav{display:flex;position:fixed;bottom:0;left:0;right:0;background:var(--surface);z-index:40;padding:9px 8px calc(9px + env(safe-area-inset-bottom));gap:4px;overflow-x:auto;box-shadow:0 -6px 24px rgba(120,100,140,.14);scrollbar-width:none}
  .mobnav::-webkit-scrollbar{display:none}
  .mobnav button{flex:0 0 auto;min-width:62px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;font-weight:800;color:var(--muted);padding:5px 6px;border-radius:14px;transition:.2s}
  .mobnav button .ic{font-size:19px}
  .mobnav button.on{color:var(--ink);background:var(--bg)}
  .dash-top{grid-template-columns:1fr}
  .g2,.g3{grid-template-columns:1fr}
  .masonry{columns:1}
  .card{padding:18px}
}
@media(max-width:520px){
  .g4{grid-template-columns:1fr 1fr}
  .catgrid{grid-template-columns:repeat(3,1fr);gap:9px}
  .cat{padding:14px 4px;font-size:11px}
  .cat b{font-size:25px}
  .bubbles{height:290px}
}

</div>

<canvas id="confetti"></canvas>
<div id="toasts"></div>
<div id="modalRoot"></div>
<script>
/* ============================================================
   DOPAMINE BUDGET — single file, localStorage only
   ============================================================ */
const KEY='dopamineBudget.v1';
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const uid=()=>Math.random().toString(36).slice(2,9);
const todayISO=()=>new Date().toISOString().slice(0,10);
const ym=d=>String(d).slice(0,7);
const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));

const CATS=[
 {k:'food',n:'Food',e:'🍕',c:'coral',g:'needs'},
 {k:'shopping',n:'Shopping',e:'🛍️',c:'lavender',g:'wants'},
 {k:'coffee',n:'Coffee',e:'☕',c:'peach',g:'wants'},
 {k:'pets',n:'Pets',e:'🐶',c:'yellow',g:'wants'},
 {k:'bills',n:'Bills',e:'💡',c:'sky',g:'bills'},
 {k:'gas',n:'Gas',e:'⛽',c:'teal',g:'needs'},
 {k:'fun',n:'Fun',e:'🎉',c:'coral',g:'wants'},
 {k:'medical',n:'Medical',e:'❤️',c:'peach',g:'needs'},
 {k:'home',n:'Home',e:'🏡',c:'mint',g:'needs'},
 {k:'travel',n:'Travel',e:'✈️',c:'sky',g:'wants'},
 {k:'subs',n:'Subscriptions',e:'📺',c:'lavender',g:'wants'},
 {k:'edu',n:'Education',e:'📚',c:'teal',g:'needs'},
 {k:'custom',n:'Custom',e:'✨',c:'yellow',g:'wants'}
];
const catOf=k=>CATS.find(c=>c.k===k)||CATS[12];

const THEMES=[
 {k:'rainbow',n:'Rainbow',cost:0,sw:['#FF9E8D','#FFD98A','#A9E7C6','#9BD6F7']},
 {k:'ocean',n:'Ocean',cost:150,sw:['#7FC8E8','#6FD6C9','#8FCFF0','#A9E0F5']},
 {k:'sunset',n:'Sunset',cost:150,sw:['#FF9C8B','#FFCF8C','#F4A6BE','#FFD3B0']},
 {k:'forest',n:'Forest',cost:250,sw:['#A8CE9A','#7FCBA8','#DCE79B','#9EE0B4']},
 {k:'candy',n:'Candy',cost:250,sw:['#FF9CC0','#D3B4F5','#9BE0E6','#FFD6E0']},
 {k:'lavender',n:'Lavender',cost:350,sw:['#B49BF0','#C1AEF3','#A9BDF2','#E0D4FB']},
 {k:'galaxy',n:'Galaxy',cost:500,sw:['#9B8BEB','#8FA8EE','#D3B0F0','#7FC4E8']},
 {k:'matcha',n:'Matcha',cost:500,sw:['#96CFB0','#C3D69B','#E4E9A6','#A8DDBB']}
];
const HABITS=[
 {k:'noimpulse',n:'No impulse buys',e:'🛑'},{k:'lunch',n:'Packed lunch',e:'🥪'},
 {k:'checked',n:'Checked budget',e:'👀'},{k:'saved',n:'Saved money',e:'💰'},
 {k:'noshop',n:'No online shopping',e:'📵'},{k:'meal',n:'Meal planned',e:'🍲'},
 {k:'water',n:'Water',e:'💧'},{k:'sleep',n:'Sleep',e:'😴'}
];
const CHALLENGES=[
 {k:'nospendweek',n:'No Spend Week',e:'🚫',d:'7 days without non-essential spending.',target:7,unit:'days',xp:150,coins:120},
 {k:'coffee',n:'Coffee Challenge',e:'☕',d:'Brew at home 14 times instead of buying.',target:14,unit:'brews',xp:120,coins:90},
 {k:'mealprep',n:'Meal Prep Week',e:'🥡',d:'Prep meals 5 days in a row.',target:5,unit:'days',xp:100,coins:80},
 {k:'w52',n:'52 Week Savings',e:'📅',d:'Save a growing amount every week for a year.',target:52,unit:'weeks',xp:600,coins:520},
 {k:'env100',n:'100 Envelope',e:'✉️',d:'Fill 100 numbered envelopes with cash.',target:100,unit:'envelopes',xp:800,coins:700},
 {k:'reset30',n:'30 Day Spending Reset',e:'🔄',d:'Log every expense for 30 days straight.',target:30,unit:'days',xp:400,coins:300}
];
const ACHIEVEMENTS=[
 {k:'firstbudget',n:'First Budget',e:'🎯',d:'Set your monthly plan'},
 {k:'firstgoal',n:'First Savings Goal',e:'🌱',d:'Create a savings goal'},
 {k:'nospend',n:'No Spend Week',e:'🛡️',d:'7 no-spend days logged'},
 {k:'k1000',n:'$1,000 Saved',e:'💎',d:'Save 1,000 across goals'},
 {k:'streak30',n:'30 Day Streak',e:'🔥',d:'Open and log 30 days running'},
 {k:'debtcrush',n:'Debt Crusher',e:'💥',d:'Fully pay off a debt'},
 {k:'master',n:'Budget Master',e:'👑',d:'Unlock every other badge'}
];
const MISSIONS=['No Spend Day','Save $20 today','Only coffee from home','Log every expense today','Move $5 to a savings goal','Unsubscribe from one thing','Eat what you already have','Check your budget for 2 minutes','Pack lunch instead of takeout','Put loose change into savings','Skip one delivery order','Review last week\u2019s spending'];
const QUOTES=['Future You says thanks ❤️','Small steps beat perfection.','Every dollar has a job.','Progress > Perfect.','You are allowed to start over today.','Boring money is peaceful money.','A budget is permission, not punishment.','You noticed. That is the hard part.','Tiny wins compound quietly.','Money is a tool, not a test.'];
const PET_ACC=[{s:5,e:'🎀',n:'Ribbon'},{s:10,e:'👑',n:'Crown'},{s:20,e:'🎩',n:'Top hat'},{s:30,e:'🕶️',n:'Shades'}];

/* ---------------- STATE ---------------- */
const blank=()=>({
  name:'Ana', currency:'$', dark:false, theme:'rainbow', sound:true,
  coins:0, xp:0, themes:['rainbow'], achievements:[],
  notif:{log:true,bill:true,save:true,challenge:false,weekly:true},
  plan:{needs:0,wants:0,savings:0,bills:0},
  income:[], expenses:[], bills:[], goals:[], wishlist:[], debts:[],
  habits:{}, moods:{}, challenges:{}, mission:null, spin:null,
  streak:{n:0,last:null}, created:todayISO(), seeded:false
});
let S=load();
function load(){
  try{const r=JSON.parse(localStorage.getItem(KEY));if(r&&r.income)return Object.assign(blank(),r);}catch(e){}
  const s=blank(); seed(s); return s;
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){toast('⚠️','Storage is full — export a backup')}}
function seed(s){
  s.seeded=true;
  const mo=todayISO().slice(0,7);
  const ago=n=>{const d=new Date();d.setDate(d.getDate()-n);return d.toISOString().slice(0,10)};
  const inMonth=n=>ym(ago(n))===mo?ago(n):mo+'-01';
  s.created=ago(45);
  s.plan={needs:900,wants:400,savings:300,bills:650};
  s.income=[{id:uid(),amount:2400,src:'Paycheck',type:'Paycheck',date:mo+'-01',rec:true},
            {id:uid(),amount:320,src:'Etsy shop',type:'Side Hustle',date:inMonth(4),rec:false}];
  s.expenses=[
    {id:uid(),amount:64.20,cat:'food',note:'Groceries',date:inMonth(9)},
    {id:uid(),amount:5.75,cat:'coffee',note:'Latte',date:inMonth(7)},
    {id:uid(),amount:42,cat:'gas',note:'Fill up',date:inMonth(6)},
    {id:uid(),amount:88.5,cat:'shopping',note:'New sneakers',date:inMonth(5)},
    {id:uid(),amount:15.99,cat:'subs',note:'Streaming',date:inMonth(3)},
    {id:uid(),amount:31,cat:'pets',note:'Dog food',date:inMonth(2)},
    {id:uid(),amount:23.4,cat:'fun',note:'Movie night',date:inMonth(1)}];
  s.bills=[
    {id:uid(),name:'Rent',e:'🏠',amount:1150,due:1,auto:false,paid:[]},
    {id:uid(),name:'Electric',e:'💡',amount:86,due:12,auto:true,paid:[]},
    {id:uid(),name:'Phone',e:'📱',amount:45,due:18,auto:true,paid:[]},
    {id:uid(),name:'Internet',e:'🛜',amount:60,due:22,auto:false,paid:[]}];
  s.goals=[
    {id:uid(),name:'Emergency Fund',e:'🛟',target:1000,saved:420,color:'teal',log:[{date:inMonth(8),amt:75}]},
    {id:uid(),name:'Vacation',e:'🏝️',target:1500,saved:210,color:'sky',log:[{date:inMonth(3),amt:50}]},
    {id:uid(),name:'New Laptop',e:'💻',target:1200,saved:75,color:'lavender',log:[]}];
  s.debts=[
    {id:uid(),name:'Credit Card',e:'💳',total:2400,paid:900,payment:150},
    {id:uid(),name:'Student Loan',e:'🎓',total:8000,paid:2100,payment:200}];
  s.moods[ago(1)]='good';s.moods[ago(2)]='okay';s.moods[ago(3)]='amazing';
  s.wishlist=[
    {id:uid(),name:'Espresso machine',e:'☕',price:280,saved:60,pri:'Medium',kind:'Want'},
    {id:uid(),name:'Running shoes',e:'👟',price:120,saved:95,pri:'High',kind:'Need'}];
}

/* ---------------- MONEY HELPERS ---------------- */
const cur=n=>{n=Number(n||0);const d=Math.abs(n%1)>0.004?2:0;
  return (n<0?'-':'')+S.currency+Math.abs(n).toLocaleString(undefined,{minimumFractionDigits:d,maximumFractionDigits:2})};
const nowM=()=>ym(todayISO());
const inM=(arr,m=nowM())=>arr.filter(x=>ym(x.date)===m);
const sum=(a,f=x=>x.amount)=>a.reduce((t,x)=>t+Number(f(x)||0),0);
function billsPaidThisMonth(m=nowM()){return S.bills.filter(b=>(b.paid||[]).includes(m))}
function billsDueTotal(m=nowM()){return sum(S.bills.filter(b=>!(b.paid||[]).includes(m)))}
function savedThisMonth(m=nowM()){
  return S.goals.reduce((t,g)=>t+sum((g.log||[]).filter(l=>ym(l.date)===m),x=>x.amt),0);
}
function ringData(){
  const ex=inM(S.expenses), g={needs:0,wants:0,savings:0,bills:0};
  ex.forEach(e=>{g[catOf(e.cat).g]+=Number(e.amount)});
  g.bills+=sum(billsPaidThisMonth());
  g.savings+=savedThisMonth();
  return g;
}
function available(){
  const inc=sum(inM(S.income)), r=ringData();
  return inc-(r.needs+r.wants+r.bills+r.savings)-billsDueTotal();
}
function netWorth(){
  return S.goals.reduce((t,g)=>t+Number(g.saved||0),0)-S.debts.reduce((t,d)=>t+(Number(d.total)-Number(d.paid)),0);
}

/* ---------------- FEEDBACK: toast, confetti, sound ---------------- */
function toast(icon,msg,ms=2600){
  const el=document.createElement('div');
  el.className='toast';el.innerHTML=`<span style="font-size:18px">${icon}</span><span>${msg}</span>`;
  $('#toasts').appendChild(el);
  setTimeout(()=>{el.classList.add('out');setTimeout(()=>el.remove(),350)},ms);
}
const cvs=$('#confetti'),ctx=cvs.getContext('2d');let parts=[],raf=null;
function fitC(){if(!ctx)return;cvs.width=innerWidth*devicePixelRatio;cvs.height=innerHeight*devicePixelRatio;cvs.style.width=innerWidth+'px';cvs.style.height=innerHeight+'px';ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0)}
addEventListener('resize',fitC);fitC();
function confetti(n=110){
  if(!ctx)return;
  if(window.matchMedia&&matchMedia('(prefers-reduced-motion:reduce)').matches){return}
  const cs=['#FF9E8D','#7ED8D0','#FFD98A','#C4B5F7','#A9E7C6','#9BD6F7','#FFC5A6'];
  for(let i=0;i<n;i++)parts.push({x:innerWidth/2+(Math.random()-.5)*260,y:innerHeight*.36,
    vx:(Math.random()-.5)*11,vy:-(Math.random()*13+5),g:.32+Math.random()*.15,
    s:5+Math.random()*8,r:Math.random()*6.28,vr:(Math.random()-.5)*.35,c:cs[i%cs.length],l:1,
    sq:Math.random()>.35});
  if(!raf)raf=requestAnimationFrame(tick);
}
function tick(){
  ctx.clearRect(0,0,innerWidth,innerHeight);
  parts=parts.filter(p=>p.l>0&&p.y<innerHeight+60);
  parts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=p.g;p.vx*=.995;p.r+=p.vr;p.l-=.004;
    ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.globalAlpha=clamp(p.l,0,1);ctx.fillStyle=p.c;
    if(p.sq)ctx.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6);else{ctx.beginPath();ctx.arc(0,0,p.s/2,0,6.3);ctx.fill()}
    ctx.restore()});
  if(parts.length)raf=requestAnimationFrame(tick);else{raf=null;ctx.clearRect(0,0,innerWidth,innerHeight)}
}
let AC=null;
function beep(notes=[[660,0],[880,.09],[1320,.18]],type='triangle'){
  if(!S.sound)return;
  try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    notes.forEach(([f,t])=>{const o=AC.createOscillator(),g=AC.createGain();
      o.type=type;o.frequency.value=f;o.connect(g);g.connect(AC.destination);
      const s=AC.currentTime+t;g.gain.setValueAtTime(.0001,s);g.gain.exponentialRampToValueAtTime(.16,s+.02);
      g.gain.exponentialRampToValueAtTime(.0001,s+.35);o.start(s);o.stop(s+.4)})}catch(e){}
}
function celebrate(msg){confetti(150);beep([[523,0],[659,.1],[784,.2],[1046,.3]]);toast('🎉',msg,3200)}

/* ---------------- REWARDS ---------------- */
function reward(coins=0,xp=0,quiet=false){
  S.coins+=coins;S.xp+=xp;save();paintCoins();
  if(!quiet&&coins)toast('🪙',`+${coins} coins`,1700);
  checkAchievements();
}
const level=()=>Math.floor(S.xp/500)+1;
const lvlPct=()=>((S.xp%500)/500)*100;
function paintCoins(){
  $('#coinN').textContent='🪙 '+S.coins;$('#coinN2').textContent='🪙 '+S.coins;
  $('#lvlN').textContent=level();$('#xpN').textContent=S.xp+' XP';$('#xpBar').style.width=lvlPct()+'%';
}
function unlock(k){
  if(S.achievements.includes(k))return;
  S.achievements.push(k);save();
  const a=ACHIEVEMENTS.find(x=>x.k===k);
  celebrate(`Badge unlocked — ${a.n} ${a.e}`);reward(100,150,true);
}
function checkAchievements(){
  const p=S.plan;
  if(p.needs+p.wants+p.savings+p.bills>0)maybe('firstbudget');
  if(S.goals.length)maybe('firstgoal');
  if(noSpendDays().length>=7)maybe('nospend');
  if(S.goals.reduce((t,g)=>t+Number(g.saved||0),0)>=1000)maybe('k1000');
  if(S.streak.n>=30)maybe('streak30');
  if(S.debts.some(d=>Number(d.paid)>=Number(d.total)&&Number(d.total)>0))maybe('debtcrush');
  const others=ACHIEVEMENTS.filter(a=>a.k!=='master').map(a=>a.k);
  if(others.every(k=>S.achievements.includes(k)))maybe('master');
}
function maybe(k){if(!S.achievements.includes(k))unlock(k)}
function noSpendDays(){
  const days=new Set(S.expenses.map(e=>e.date));
  const out=[];const start=new Date(S.created);const end=new Date();
  for(let d=new Date(start);d<=end;d.setDate(d.getDate()+1)){
    const i=d.toISOString().slice(0,10);if(!days.has(i))out.push(i);}
  return out;
}
function touchStreak(){
  const t=todayISO();if(S.streak.last===t)return;
  const y=new Date(Date.now()-864e5).toISOString().slice(0,10);
  S.streak.n=S.streak.last===y?S.streak.n+1:1;S.streak.last=t;save();
}

/* ---------------- MODAL ---------------- */
function modal(title,body,onOk,okText='Save'){
  const root=$('#modalRoot');
  root.innerHTML=`<div class="scrim" id="scrim"><div class="modal" role="dialog" aria-modal="true">
    <h3>${title}</h3><div id="mbody">${body}</div>
    <div class="mrow"><button class="btn gho" id="mCancel">Cancel</button>
    ${onOk?`<button class="btn pri" id="mOk">${okText}</button>`:''}</div></div></div>`;
  const close=()=>{root.innerHTML='';document.onkeydown=null};
  $('#scrim').onclick=e=>{if(e.target.id==='scrim')close()};
  $('#mCancel').onclick=close;
  if(onOk)$('#mOk').onclick=()=>{if(onOk($('#mbody'))!==false)close()};
  document.onkeydown=e=>{if(e.key==='Escape')close()};
  const f=root.querySelector('input,select,textarea');if(f)setTimeout(()=>f.focus(),60);
  return close;
}
const val=(r,id)=>{const el=r.querySelector('#'+id);return el?el.value.trim():''};
const num=(r,id)=>parseFloat(val(r,id))||0;
/* ============================================================
   ROUTER
   ============================================================ */
const VIEWS=[
 {k:'dash',n:'Dashboard',ic:'🏠'},
 {k:'expenses',n:'Expenses',ic:'💸'},
 {k:'income',n:'Income',ic:'💵'},
 {k:'insights',n:'Insights',ic:'🫧'},
 {k:'bills',n:'Bills',ic:'🧾'},
 {k:'goals',n:'Savings',ic:'🌱'},
 {k:'wishlist',n:'Wishlist',ic:'💖'},
 {k:'debt',n:'Debt',ic:'🪄'},
 {k:'calendar',n:'Calendar',ic:'📆'},
 {k:'challenges',n:'Challenges',ic:'🏅'},
 {k:'habits',n:'Habits',ic:'✅'},
 {k:'reports',n:'Reports',ic:'📊'},
 {k:'rewards',n:'Rewards',ic:'🎁'},
 {k:'settings',n:'Settings',ic:'⚙️'}
];
let route='dash';
function paintNav(){
  $('#nav').innerHTML=VIEWS.map(v=>`<button data-a="go" data-k="${v.k}" class="${route===v.k?'on':''}"><span class="ic">${v.ic}</span>${v.n}</button>`).join('');
  $('#mobnav').innerHTML=VIEWS.map(v=>`<button data-a="go" data-k="${v.k}" class="${route===v.k?'on':''}"><span class="ic">${v.ic}</span>${v.n}</button>`).join('');
}
function go(k){route=k;paintNav();render();try{window.scrollTo({top:0,behavior:'smooth'})}catch(e){}}
function render(){
  const f={dash:vDash,expenses:vExpenses,income:vIncome,insights:vInsights,bills:vBills,goals:vGoals,
    wishlist:vWishlist,debt:vDebt,calendar:vCalendar,challenges:vChallenges,habits:vHabits,
    reports:vReports,rewards:vRewards,settings:vSettings}[route];
  $('#view').innerHTML=f();
  paintCoins();
  if(route==='dash')afterDash();
  if(route==='reports')requestAnimationFrame(paintBars);
  if(route==='goals'||route==='debt'||route==='wishlist'||route==='challenges')requestAnimationFrame(()=>{
    $$('.bar i').forEach(b=>{b.style.width=b.dataset.w+'%'})});
}

function greeting(){
  const h=new Date().getHours();
  return h<12?['Good morning','🌞']:h<18?['Good afternoon','🌈']:['Good evening','🌙'];
}
function petMood(){
  const st=S.streak.n, logged=inM(S.expenses).length, hab=Object.keys(S.habits[todayISO()]||{}).length;
  const score=st*2+logged+hab*2;
  if(score>=18)return{e:'🐱',m:'thriving',t:'is purring with pride'};
  if(score>=10)return{e:'🐱',m:'happy',t:'is feeling great'};
  if(score>=4)return{e:'🐱',m:'ok',t:'is doing fine'};
  return{e:'😴',m:'sleepy',t:'is getting sleepy — log something today'};
}
function dailyMission(){
  const t=todayISO();
  if(!S.mission||S.mission.date!==t){
    const seedN=[...t].reduce((a,c)=>a+c.charCodeAt(0),0);
    S.mission={date:t,text:MISSIONS[seedN%MISSIONS.length],done:false};save();
  }
  return S.mission;
}

function recentList(n){
  const items=[...S.expenses.map(e=>({...e,kind:'exp'})),...S.income.map(i=>({...i,kind:'inc'}))]
    .sort((a,b)=>b.date.localeCompare(a.date)||0).slice(0,n);
  if(!items.length)return `<div class="empty"><b>🍃</b>Nothing logged yet. Tap a category to start.</div>`;
  return `<div class="list">${items.map(x=>x.kind==='exp'
    ?`<div class="row"><div class="em">${catOf(x.cat).e}</div><div class="gr"><b>${x.note||catOf(x.cat).n}</b><small>${catOf(x.cat).n} · ${fmtD(x.date)}</small></div><div class="amt">-${cur(x.amount)}</div></div>`
    :`<div class="row"><div class="em">💵</div><div class="gr"><b>${x.src}</b><small>${x.type} · ${fmtD(x.date)}</small></div><div class="amt" style="color:var(--teal)">+${cur(x.amount)}</div></div>`).join('')}</div>`;
}
const fmtD=d=>new Date(d+'T12:00').toLocaleDateString(undefined,{month:'short',day:'numeric'});
function afterDash(){
  const el=$('#avNum');if(!el)return;
  const target=available();let t0=null;
  const dur=1100;
  function step(ts){t0=t0||ts;const p=clamp((ts-t0)/dur,0,1);const e=1-Math.pow(1-p,3);
    el.textContent=cur(Math.round(target*e));if(p<1)requestAnimationFrame(step)}
  requestAnimationFrame(step);
}
function banners(){
  if(!S.notif)return '';
  const out=[];const d=new Date().getDate();
  if(S.notif.bill){
    const soon=S.bills.filter(b=>!(b.paid||[]).includes(nowM())&&b.due>=d&&b.due-d<=3);
    if(soon.length)out.push(`<div class="banner">🔔 <span>${soon[0].name} (${cur(soon[0].amount)}) is due on the ${ord(soon[0].due)} — tap Bills to mark it paid.</span></div>`);
  }
  if(S.notif.log&&!inM(S.expenses).some(e=>e.date===todayISO()))
    out.push(`<div class="banner" style="background:linear-gradient(135deg,var(--peach),var(--yellow))">✍️ <span>Nothing logged today yet. Even a $3 coffee counts.</span></div>`);
  if(S.notif.weekly&&new Date().getDay()===0)
    out.push(`<div class="banner" style="background:linear-gradient(135deg,var(--mint),var(--teal))">📊 <span>It's weekly review day — open Reports for a 2-minute check-in.</span></div>`);
  return out.slice(0,2).join('');
}
const ord=n=>n+(['th','st','nd','rd'][(n%100>>3^1&&n%10)||0]||'th');

/* ---- wheel ---- */
const SPINS=[{l:'+25',e:'🪙',c:'coral',t:'coins',v:25},{l:'+100',e:'💰',c:'yellow',t:'coins',v:100},
 {l:'2x XP',e:'⚡',c:'lavender',t:'xp',v:200},{l:'Savings',e:'🌱',c:'mint',t:'save',v:10},
 {l:'Quote',e:'💌',c:'sky',t:'quote'},{l:'Confetti',e:'🎊',c:'peach',t:'confetti'}];
function wheelSVG(){
  const n=SPINS.length,a=360/n;
  const seg=SPINS.map((s,i)=>{
    const st=(i*a-90)*Math.PI/180, en=((i+1)*a-90)*Math.PI/180, R=95;
    const x1=95+R*Math.cos(st),y1=95+R*Math.sin(st),x2=95+R*Math.cos(en),y2=95+R*Math.sin(en);
    const mid=(i*a+a/2-90)*Math.PI/180, tx=95+58*Math.cos(mid), ty=95+58*Math.sin(mid);
    return `<path d="M95,95 L${x1},${y1} A${R},${R} 0 0,1 ${x2},${y2} Z" fill="var(--${s.c})"/>
      <text x="${tx}" y="${ty}" text-anchor="middle" dominant-baseline="middle" font-size="17">${s.e}</text>`;
  }).join('');
  return `<svg id="wheelSvg" viewBox="0 0 190 190">${seg}</svg>`;
}
function doSpin(){
  const t=todayISO();if(S.spin===t)return;
  const i=Math.floor(Math.random()*SPINS.length), a=360/SPINS.length;
  const deg=360*5+(360-(i*a+a/2));
  const svg=$('#wheelSvg');svg.style.transform=`rotate(${deg}deg)`;
  beep([[440,0],[520,.08],[600,.16]]);
  S.spin=t;save();
  setTimeout(()=>{
    const p=SPINS[i];
    if(p.t==='coins'){reward(p.v,25);toast(p.e,`+${p.v} coins!`)}
    if(p.t==='xp'){reward(0,p.v);toast('⚡','+200 XP — double bonus!')}
    if(p.t==='save'){if(S.goals[0]){S.goals[0].saved+=p.v;(S.goals[0].log=S.goals[0].log||[]).push({date:t,amt:p.v});save();toast('🌱',`${cur(p.v)} boost into ${S.goals[0].name}`)}else{reward(50,20)}}
    if(p.t==='quote')toast('💌',QUOTES[Math.floor(Math.random()*QUOTES.length)],4000);
    if(p.t==='confetti'){confetti(160);toast('🎊','Pure celebration. No notes.')}
    celebrateSmall();render();
  },4300);
}
function celebrateSmall(){confetti(50);beep()}

function payBill(id){
  const b=S.bills.find(x=>x.id===id),m=nowM();b.paid=b.paid||[];
  const i=b.paid.indexOf(m);
  if(i>=0){b.paid.splice(i,1);save();render();return}
  b.paid.push(m);save();render();
  beep([[523,0],[698,.08],[880,.16]]);confetti(60);reward(15,30,true);
  toast('✅',`${b.name} paid — one less thing. +15 coins`);
}

function plantSVG(stage,color){
  const c=`var(--${color})`;
  const pot=`<path d="M42,140 L98,140 L92,172 Q70,178 48,172 Z" fill="var(--peach)"/><rect x="38" y="130" width="64" height="13" rx="6" fill="var(--coral)"/>`;
  const stem=h=>`<path d="M70,132 C68,${132-h*.5} 72,${132-h*.75} 70,${132-h}" stroke="${'var(--mint)'}" stroke-width="6" fill="none" stroke-linecap="round"/>`;
  const S0=`<ellipse cx="70" cy="126" rx="9" ry="7" fill="#B08968"/><ellipse cx="67" cy="124" rx="3" ry="2" fill="#D5A87F"/>`;
  const S1=stem(28)+`<ellipse cx="60" cy="112" rx="12" ry="7" fill="var(--mint)" transform="rotate(-22 60 112)"/>`;
  const S2=stem(52)+`<ellipse cx="52" cy="98" rx="17" ry="9" fill="var(--mint)" transform="rotate(-25 52 98)"/>
    <ellipse cx="88" cy="106" rx="17" ry="9" fill="var(--teal)" transform="rotate(22 88 106)"/>`;
  const S3=S2+`<g transform="translate(70,74)"><circle r="11" fill="${c}"/>
    ${[0,60,120,180,240,300].map(a=>`<ellipse cx="${20*Math.cos(a*Math.PI/180)}" cy="${20*Math.sin(a*Math.PI/180)}" rx="11" ry="8" fill="${c}" transform="rotate(${a} ${20*Math.cos(a*Math.PI/180)} ${20*Math.sin(a*Math.PI/180)})"/>`).join('')}
    <circle r="8" fill="var(--yellow)"/></g>`;
  const S4=stem(58)+`<circle cx="70" cy="66" r="34" fill="var(--mint)"/><circle cx="46" cy="80" r="21" fill="var(--teal)"/>
    <circle cx="94" cy="80" r="21" fill="var(--teal)"/><circle cx="70" cy="46" r="19" fill="${c}"/>
    <circle cx="58" cy="62" r="5" fill="var(--yellow)"/><circle cx="86" cy="70" r="5" fill="var(--coral)"/><circle cx="70" cy="88" r="5" fill="var(--surface)"/>`;
  const art=[S0,S1,S2,S3,S4][stage];
  return `<svg width="140" height="180" viewBox="0 0 140 180"><g class="sway">${art}</g>${pot}</svg>`;
}

/* ============================================================
   CALENDAR
   ============================================================ */
let calM=new Date().getMonth(), calY=new Date().getFullYear();
function vCalendar(){
  const first=new Date(calY,calM,1), start=first.getDay(), days=new Date(calY,calM+1,0).getDate();
  const prevDays=new Date(calY,calM,0).getDate();
  const mkey=`${calY}-${String(calM+1).padStart(2,'0')}`;
  const cells=[];
  for(let i=start-1;i>=0;i--)cells.push({d:prevDays-i,out:true});
  for(let d=1;d<=days;d++)cells.push({d,out:false,iso:`${mkey}-${String(d).padStart(2,'0')}`});
  while(cells.length%7)cells.push({d:cells.length-start-days+1,out:true});
  const monthName=first.toLocaleDateString(undefined,{month:'long',year:'numeric'});
  const t=todayISO();
  return `
  <div class="sec-h"><div><div class="eyebrow">Your month at a glance</div><h2>Calendar</h2></div>
    <div style="display:flex;gap:8px;align-items:center">
      <button class="btn sm gho" data-a="calprev">‹</button>
      <b class="dspl" style="min-width:150px;text-align:center">${monthName}</b>
      <button class="btn sm gho" data-a="calnext">›</button></div></div>
  <div class="card" style="margin-bottom:18px">
    <div class="cal">
      ${['S','M','T','W','T','F','S'].map(d=>`<div class="dw">${d}</div>`).join('')}
      ${cells.map(c=>{
        if(c.out)return `<div class="d out">${c.d}</div>`;
        const dots=dayDots(c.iso);
        return `<div class="d ${c.iso===t?'today':''}">${c.d}
          <div class="dots">${dots.map(x=>`<i style="background:var(--${x[1]})" title="${x[0]}"></i>`).join('')}</div></div>`}).join('')}
    </div>
    <div class="legend" style="grid-template-columns:repeat(3,1fr);margin-top:18px">
      <div><i style="background:var(--teal)"></i>Payday</div>
      <div><i style="background:var(--sky)"></i>Bill due</div>
      <div><i style="background:var(--mint)"></i>No spend</div>
      <div><i style="background:var(--lavender)"></i>Savings</div>
      <div><i style="background:var(--coral)"></i>Big purchase</div>
      <div><i style="background:var(--yellow)"></i>Mood logged</div>
    </div>
  </div>
  <div class="grid g2">
    <div class="card"><div class="sec-h"><h2>This month's rhythm</h2></div>
      <div class="list">
        <div class="row"><div class="em">🛡️</div><div class="gr"><b>No-spend days</b><small>Zero spending logged</small></div><div class="amt">${noSpendDays().filter(d=>ym(d)===mkey).length}</div></div>
        <div class="row"><div class="em">💵</div><div class="gr"><b>Paydays</b><small>Income received</small></div><div class="amt">${inM(S.income,mkey).length}</div></div>
        <div class="row"><div class="em">🧾</div><div class="gr"><b>Bills due</b><small>Recurring commitments</small></div><div class="amt">${S.bills.length}</div></div>
        <div class="row"><div class="em">🌱</div><div class="gr"><b>Savings deposits</b><small>Money moved to goals</small></div><div class="amt">${S.goals.reduce((t,g)=>t+(g.log||[]).filter(l=>ym(l.date)===mkey).length,0)}</div></div>
      </div></div>
    <div class="card"><div class="sec-h"><h2>Mood check</h2></div>
      ${moodSummary(mkey)}</div>
  </div>`;
}
function dayDots(iso){
  const out=[],day=parseInt(iso.slice(-2));
  if(S.income.some(i=>i.date===iso))out.push(['Payday','teal']);
  if(S.bills.some(b=>b.due===day))out.push(['Bill due','sky']);
  if(S.goals.some(g=>(g.log||[]).some(l=>l.date===iso)))out.push(['Savings','lavender']);
  const spent=S.expenses.filter(e=>e.date===iso);
  if(spent.some(e=>Number(e.amount)>=100))out.push(['Big purchase','coral']);
  if(!spent.length&&iso<=todayISO()&&iso>=S.created)out.push(['No spend','mint']);
  if(S.moods[iso])out.push(['Mood','yellow']);
  return out.slice(0,4);
}
function moodSummary(mkey){

function bumpChallenge(k,by=1){
  const c=CHALLENGES.find(x=>x.k===k);if(!c)return;

  if(st.prog>=c.target){celebrate(`${c.n} complete! +${c.coins} coins, +${c.xp} XP`);reward(c.coins,c.xp,true)}
}

function last7(){
  const out=[];for(let i=6;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);out.push(d.toISOString().slice(0,10))}
  return out;
}
function habitStreak(k){
  let n=0;const d=new Date();
  for(;;){const iso=d.toISOString().slice(0,10);
    if((S.habits[iso]||{})[k]){n++;d.setDate(d.getDate()-1)}else break;
    if(n>400)break}
  return n;
}

      if(k==='noimpulse')bumpChallenge('nospendweek');
      const st=habitStreak(k);
      if(st>0&&st%7===0)celebrate(`${st} day streak on ${HABITS.find(h=>h.k===k).n}!`);}
  },
  chjoin:el=>{S.challenges[el.dataset.k]={joined:true,prog:0};save();render();
    toast('🏅',`You're in — ${CHALLENGES.find(c=>c.k===el.dataset.k).n} started`)},
  chquit:el=>{delete S.challenges[el.dataset.k];save();render()},
  chprog:el=>{const k=el.dataset.k;bumpChallenge(k);const c=CHALLENGES.find(x=>x.k===k);
    if(S.challenges[k].prog<c.target){beep([[600,0],[760,.07]]);toast(c.e,`${S.challenges[k].prog}/${c.target} ${c.unit}`)}
    render()},
  theme:el=>pickTheme(el.dataset.k),
  toggle:el=>{
    const k=el.dataset.k;
    if(k==='dark'){S.dark=!S.dark;applyTheme()}
    else if(k==='sound'){S.sound=!S.sound;if(S.sound)beep()}
    else S.notif[k.slice(2)]=!S.notif[k.slice(2)];
    save();render();
  },
  saveprofile:()=>{
    S.name=$('#setName').value.trim()||'friend';
    S.currency=$('#setCur').value.trim()||'$';
    save();render();toast('✨','Saved — looking good, '+S.name);
  },
  saveplan:()=>{
    ['needs','wants','savings','bills'].forEach(k=>S.plan[k]=parseFloat($('#plan_'+k).value)||0);
    save();checkAchievements();render();toast('🎯','Monthly plan updated');
  },
  export:()=>doExport(),
  import:()=>doImport(),
  reset:()=>doReset(),
  quote:()=>{toast('💌',QUOTES[Math.floor(Math.random()*QUOTES.length)],4500);confetti(35)}
};
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-a]');if(!el)return;
  const fn=ACTIONS[el.dataset.a];if(fn){e.preventDefault();fn(el)}
});

/* ============================================================
   EASTER EGGS + INIT
   ============================================================ */
let clicks=0;
document.addEventListener('click',()=>{
  clicks++;
  if(clicks%37===0){toast('💫',QUOTES[Math.floor(Math.random()*QUOTES.length)],4000)}
});
let keys='';
addEventListener('keydown',e=>{
  keys=(keys+e.key.toLowerCase()).slice(-6);
  if(keys.endsWith('rich')){celebrate('Future You says thanks ❤️');reward(50,50)}
});
function init(){
  applyTheme();
  paintNav();
  touchStreak();
  dailyMission();
  checkAchievements();
  render();
  setTimeout(()=>{
    const h=new Date().getHours();
    toast(h<12?'🌞':h<18?'🌈':'🌙',`Welcome back, ${S.name}. ${S.streak.n>1?`Day ${S.streak.n} of your streak.`:'Glad you opened this.'}`,3600);
  },700);
}
init();
</script>
</body>
</html>
